[project]
name = "debank-scraper"
version = "0.1.0"
description = "EVM wallet portfolio and DeFi position scraper from DeBank with MCP support"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "nichsedge"}]
keywords = ["debank", "ethereum", "evm", "defi", "crypto", "portfolio", "playwright", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "mcp>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/nichsedge/debank-scraper"
Repository = "https://github.com/nichsedge/debank-scraper.git"
"Bug Tracker" = "https://github.com/nichsedge/debank-scraper/issues"

[project.scripts]
debank-scrape = "debank_scraper.cli:main"
debank-mcp = "debank_scraper.mcp:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
