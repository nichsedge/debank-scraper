[project]
name = "debank-scraper"
version = "0.1.0"
description = "EVM wallet portfolio and DeFi position scraper from DeBank with MCP support"
readme = "README.md"
requires-python = ">=3.14.7"
license = {text = "MIT"}
authors = [{name = "nichsedge"}]
keywords = [
    "debank",
    "ethereum",
    "evm",
    "defi",
    "crypto",
    "portfolio",
    "playwright",
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "web3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "playwright>=1.62.0",
    "python-dotenv>=1.2.3",
    "mcp>=2.1.0,<3",
]

[project.urls]
Homepage = "https://github.com/nichsedge/debank-scraper"
Documentation = "https://github.com/nichsedge/debank-scraper#readme"
Repository = "https://github.com/nichsedge/debank-scraper.git"
"Bug Tracker" = "https://github.com/nichsedge/debank-scraper/issues"

[project.scripts]
debank-scrape = "debank_scraper.cli:main"
debank-mcp = "debank_scraper.mcp:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
